[package]
name = "execution-engine"
version = "2.0.0"
edition = "2021"
description = "Test execution engine that orchestrates phases, plugs, and runtime workers for TofuPilot procedures."
license = "MIT"
authors = ["TofuPilot <hello@tofupilot.com>"]
homepage = "https://tofupilot.com"
repository = "https://github.com/tofupilot/framework"
readme = "README.md"
keywords = ["tofupilot", "testing", "manufacturing", "orchestration", "runtime"]
categories = ["development-tools::testing"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Every procedure.yaml goes through `procedure::yaml`. Reading only:
# writing YAML is test-only (see the dev-dependency below).
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize"] }
serde_trim = "1.1"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
dirs = "6"
regex = "1"
log = "0.4"
tokio = { version = "1", features = ["sync", "rt", "rt-multi-thread", "process", "time", "io-util", "macros", "net"] }
validator = { version = "0.20", features = ["derive"] }
base64 = "0.22"
futures = "0.3"
async-trait = "0.1"
command-group = { version = "5.0", features = ["with-tokio"] }
mime_guess = "2.0"
nix = { version = "0.30", features = ["signal"] }
sha2 = "0.10"
station-protocol = { path = "crates/station-protocol" }
# JSON Schema of the procedure YAML (feature `json-schema`): what the
# assistant, the daemon and the CI drift check read instead of a
# hand-copied field list.
# No `preserve_order`: it would switch serde_json to IndexMap for the
# whole CLI (a feature unifies across the build), which changes every
# JSON output's key order and grew `Value` past clippy's
# result_large_err limit. Properties come out sorted; the web renderer
# orders them for the prompt.
schemars = { version = "1", optional = true }

[dev-dependencies]
tempfile = "3"
# `test-util` enables tokio's paused clock (`start_paused`) for the
# port-handshake deadline tests. Dev-only; not in release builds.
tokio = { version = "1", features = ["test-util"] }
# `serialize` backs the test-only `procedure::yaml::to_string`. Dev-only;
# not in release builds.
serde-saphyr = { version = "1.3", default-features = false, features = ["deserialize", "serialize"] }

[features]
default = []
json-schema = ["dep:schemars", "station-protocol/json-schema"]
