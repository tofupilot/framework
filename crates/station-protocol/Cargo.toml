[package]
name = "station-protocol"
version = "0.1.0"
edition = "2021"
description = "Shared real-time protocol types for TofuPilot CLI, execution engine, and dashboard."
license = "MIT"
authors = ["TofuPilot <hello@tofupilot.com>"]
homepage = "https://tofupilot.com"
repository = "https://github.com/tofupilot/framework"
readme = "README.md"
keywords = ["tofupilot", "protocol", "testing", "manufacturing"]
categories = ["development-tools::testing", "encoding"]
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# TypeScript export of the wire types (feature `specta`), only for the
# `export-types` binary: the CLI build does not pull specta in.
specta = { version = "=1.0.5", features = ["serde", "typescript", "export"], optional = true }
regex = "1"
# JSON Schema export of the YAML-facing enums (feature `json-schema`), for
# the procedure schema the execution engine publishes.
schemars = { version = "1", optional = true }

[features]
default = []
json-schema = ["dep:schemars"]
specta = ["dep:specta"]

