name: Test-5 — Bug fixed
version: 1.0.0
description: A new test procedure

execution:
  on_first_failure: continue

unit:
  serial_number:
    default_value: SN-12345
    min_length: 8
    max_length: 8
  part_number:
    default_value: PCB01
  revision_number:
    default_value: A
  batch_number:
    default_value: 25-001

setup:
- key: phase_3
  name: Setup
  description: Here we connect to a plug
  ui:
    components:
    - type: multidropdown
      key: multidropdown
      options: []
  enabled: false

main:
- key: phase_5
  name: Operator blaz
  ui:
    components:
    - type: multidropdown
      key: multidropdown
      label: 'Select your name '
      required: true
      options:
      - value: Sarah
        label: ''
      - value: Julie
        label: ''
      - value: Clauclau
        label: ''
      - value: Claudette’s
        label: ''
    - type: switch
      key: switch
      label: Are you there
      required: true
      options: []
      default_value: Yes
  enabled: false
- key: phase_2
  name: Get Temperature
  python: phases.phases:get_temperature
  measurements:
  - key: temperature
    name: temperature
    unit: C
    validators:
    - outcome: UNSET
      operator: =
      expected_value: 25.9
- key: phase_1
  name: Electrical tests
  python: phases.phases:get_input_voltage
  measurements:
  - key: voltage
    name: voltage
    unit: V
    validators:
    - outcome: UNSET
      operator: '>='
      expected_value: 3.0
  enabled: false

teardown:
- key: phase_4
  name: New Phase 4
  enabled: false
