# Structure Validation Errors - Duplicates and dependencies

name: Structure Validation Test
version: 1.0.0

# Duplicate phase keys
main:
  - key: duplicate_phase
    name: "Phase 1"
    python: test1
  - key: duplicate_phase
    name: "Phase 2"
    python: test2
  - key: another_dup
    name: "Phase 3"
    python: test3
  - key: another_dup
    name: "Phase 4"
    python: test4

# Duplicate plug keys
plugs:
  - key: duplicate_plug
    name: "Plug 1"
    python: setup1
  - key: duplicate_plug
    name: "Plug 2"
    python: setup2
  - key: dup_plug2
    name: "Plug 3"
    python: setup3
  - key: dup_plug2
    name: "Plug 4"
    python: setup4

# Duplicate measurement keys within same phase
setup:
  - key: setup_phase
    name: "Setup"
    python: setup
    measurements:
      - key: voltage
        name: "Voltage 1"
        unit: "V"
      - key: voltage
        name: "Voltage 2"
        unit: "V"
      - key: current
        name: "Current 1"
        unit: "A"
      - key: current
        name: "Current 2"
        unit: "A"

teardown:
  # Orphaned dependency - depends on nonexistent phase
  - key: orphan1
    name: "Orphan 1"
    python: test_orphan1
    depends_on: ["nonexistent_phase"]

  - key: orphan2
    name: "Orphan 2"
    python: test_orphan2
    depends_on: ["missing_phase1", "missing_phase2"]

  # Self-dependency
  - key: self_dep1
    name: "Self Dep 1"
    python: test_self1
    depends_on: ["self_dep1"]

  - key: self_dep2
    name: "Self Dep 2"
    python: test_self2
    depends_on: ["self_dep2", "orphan1"]

  # Circular dependency (2 phases)
  - key: circular_a
    name: "Circular A"
    python: test_a
    depends_on: ["circular_b"]
  - key: circular_b
    name: "Circular B"
    python: test_b
    depends_on: ["circular_a"]

  # Circular dependency (3 phases)
  - key: circular_x
    name: "Circular X"
    python: test_x
    depends_on: ["circular_y"]
  - key: circular_y
    name: "Circular Y"
    python: test_y
    depends_on: ["circular_z"]
  - key: circular_z
    name: "Circular Z"
    python: test_z
    depends_on: ["circular_x"]

  # Circular dependency (4 phases)
  - key: circ_1
    name: "Circ 1"
    python: test1
    depends_on: ["circ_2"]
  - key: circ_2
    name: "Circ 2"
    python: test2
    depends_on: ["circ_3"]
  - key: circ_3
    name: "Circ 3"
    python: test3
    depends_on: ["circ_4"]
  - key: circ_4
    name: "Circ 4"
    python: test4
    depends_on: ["circ_1"]
