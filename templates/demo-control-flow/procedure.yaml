name: Control Flow Demo
version: 1.0.0
description: Demonstrates control flow - PhaseResult returns, when reactions, setup/teardown, parallel execution
execution:
  model: slot_first
  workers: 2
  on_first_failure: continue
  slots:
    - id: SLOT_A
      name: SLOT_A
    - id: SLOT_B
      name: SLOT_B
setup:
  - name: setup_all
    scope: all
    description: Configure and prepare test equipment - runs once at procedure start
    python: phases/setup_all
  - name: setup_each
    description: Configure and prepare unit under test - runs before each slot
    python:
      module: setup_each
main:
- name: do_nothing
  description: Default behavior - Returns None = CONTINUE (Fail → Continue by default)
  python:
    module: do_nothing
- name: return_continue
  description: Explicitly returns CONTINUE (outcome based on measurements)
  python:
    module: return_continue
- name: return_fail
  description: Returns FAIL (outcome is FAIL, when.fail determines next action)
  python:
    module: return_fail
- name: measurement_validation_fail
  description: Returns CONTINUE but measurement validation fails (Critical validator fails → outcome is FAIL)
  python: phases/measurement_validation_fail
  measurements:
    - name: voltage
      unit: V
      validators:
      - level: critical
        operator: '>='
        expected_value: 3.0
- name: return_skip
  description: Returns SKIP (outcome is SKIP, continues to next phase)
  python:
    module: return_skip
- name: conditional_retry
  description: 'Override: then.fail → retry (retries up to 3 times on failure)'
  python: phases/conditional_repeat
  retry:
    limit: 3
    delay: 1s
  then:
    fail: retry
- name: return_repeat
  description: Returns REPEAT up to 3 additional times (outcome SKIP then ERROR)
  python:
    module: return_repeat
- name: skip_on_timeout
  description: 'Override: then.timeout → skip (default is Stop)'
  python: phases/slow_phase
  timeout: 2s
  then:
    timeout: skip
- name: skip_on_error
  description: 'Override: then.error → skip (default is Stop)'
  python:
    module: raise_error
  then:
    error: skip
- name: fail_and_stop
  description: 'Override: then.fail → stop (default is Continue)'
  python:
    module: return_fail
  then:
    fail: stop
- name: never_executed_phase
  description: Never executes - previous phase stopped execution with then.fail → stop
  python:
    module: never_executed_phase
teardown:
  - name: teardown_each
    description: Clean up after testing each individual unit
    python: phases/teardown_each
  - name: teardown_all
    scope: all
    description: Shut down the entire test system once at end
    python:
      module: teardown_all
