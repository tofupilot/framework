name: Operator UI Basic
version: 1.0.0
description: Shows operator UI components for input and display

main:
- key: operator_inputs
  name: Operator Inputs
  description: Operator sets test parameters using input components
  ui:
    components:
    - type: number_input
      key: target_voltage
      label: Target Voltage (V)
      description: Enter target voltage for test
      required: false
      default_value: 5.0
      trim: true
      min: 0.0
      max: 12.0
      step: 0.1
    - type: slider
      key: test_duration
      label: Test Duration (seconds)
      description: Slide to set test duration
      required: false
      default_value: 10.0
      trim: true
      min: 5.0
      max: 60.0
      step: 5.0
- key: display_updates
  name: Display Updates
  python: phases.run_test
  description: Python updates display components during execution
  depends_on:
    - operator_inputs
  ui:
    components:
    - type: text
      key: status_text
      label: Test Status
      required: false
      default_value: Waiting to start...
      trim: true
      size: lg
    - type: progress
      key: progress_bar
      label: Test Progress
      required: false
      default_value: 0.0
      trim: true
      min: 0.0
      max: 100.0
