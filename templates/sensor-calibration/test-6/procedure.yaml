name: 'Test-6: measurements binding'
version: 1.0.0
description: A new test procedure

execution:
  workers: 8
  on_first_failure: stop
  slots:
  - key: slot_a
    name: SLOT_A

unit:
  serial_number:
    default_value: SN-11111
  part_number:
    default_value: PCB01

setup:
- key: new_phase_5
  name: New Phase 5
  measurements:
  - key: initial_value
    name: Initial_value
    validators:
    - operator: ==
      expected_value: 1.0
  ui:
    components:
    - type: number_input
      key: number_input
      label: 1?
      bind: measurements.initial_value
      options: []
      default_value: '1'

main:
- key: phase_1
  name: board power
  measurements:
  - key: check_led_powered
    name: check_led_powered
    unit: '-'
    validators:
    - operator: ==
      expected_value: true
  - key: current
    name: Current
    unit: A
    validators:
    - operator: <
      expected_value: 5.0
  - key: voltage
    name: voltage
    validators:
    - operator: '>'
      expected_value: 4.0
  ui:
    components:
    - type: switch
      key: switch
      label: is LED on?
      bind: measurements.check_led_powered
      options: []
    - type: number_input
      key: voltage
      label: voltage
      bind: measurements.voltage
      options: []
    - type: number_input
      key: number_input_1vw
      label: current?
      bind: measurements.current
      options: []
- key: phase_2
  name: temperature info
  measurements:
  - key: temp1
    name: temp1
    unit: C
    validators:
    - operator: '>'
      expected_value: 25.0
  - key: temp2
    name: temp2
    unit: C
    validators:
    - operator: <
      expected_value: 35.0
    - operator: '> '
      expected_value: 28.0
  ui:
    components:
    - type: slider
      key: slider
      label: temperature?
      required: true
      bind: measurements.temp1
      min: 15.0
      max: 35.0
      step: 1.0
      options: []
      default_value: 25.0
    - type: slider
      key: slider_fkl
      label: inside_temperature?
      required: true
      bind: measurements.temp2
      min: 25.0
      max: 40.0
      step: 1.0
      options: []
- key: phase_4
  name: New Phase 4
  measurements:
  - key: teardown_check
    name: teardown_check
    unit: --
    validators:
    - operator: ==
      expected_value: 'True'
  ui:
    components:
    - type: radio
      key: radio
      bind: measurements.teardown_check
      options:
      - value: 'True'
        label: T
      - value: 'False'
        label: F

teardown:
- key: phase_3
  name: New Phase 3
  measurements:
  - key: checklist
    name: checklist
    unit: --
    validators:
    - operator: matches
      expected_value: Blue
  ui:
    components:
    - type: radio
      key: radio
      label: Is it Blue?
      bind: measurements.checklist
      options:
      - value: Blue
        label: Blue
      - value: Red
        label: Red
      - value: Green
        label: Green
