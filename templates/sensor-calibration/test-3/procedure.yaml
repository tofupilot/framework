name: 'Test-3: python script'
version: 1.0.1
description: A new test procedure

execution:
  workers: 8
  on_first_failure: stop
  slots:
  - key: slot_a
    name: SLOT_A

unit:
  serial_number:
    default_value: SN-11111
  part_number:
    default_value: PCB01

main:
- key: phase_1
  name: Electrical tests
  python: phases.print_information_in_phase:perform_electrical_tests
  measurements:
  - key: voltage
    name: voltage
    unit: degree
    validators:
    - operator: '>'
      expected_value: 3.0
- key: phase_2
  name: Get Temperature
  python: phases.print_information_in_phase:get_temperature
  measurements:
  - key: temperature
    name: temperature
    unit: degree
    validators:
    - operator: '>='
      expected_value: 25.0
    - operator: <
      expected_value: 35.0
  - key: input_temperature
    name: Input_temperature
  - key: temperature_with_units
    name: temperature_with_units
    unit: degrees
    validators:
    - operator: '>'
      expected_value: 1.0
- key: phase_3
  name: Get Data
  python: phases.print_information_in_phase:get_data
  measurements:
  - key: measure_one
    name: measure_one
    unit: '-'
    validators:
    - operator: ==
      expected_value: 1.0
  - key: measure_two
    name: measure_two
    unit: string
    validators:
    - operator: matches
      expected_value: hello
  - key: measure_three
    name: measure_three
    unit: Boolean
    validators:
    - operator: ==
      expected_value: 'True'
  - key: measure_four
    name: measure_four
    validators:
    - operator: in
      expected_value: '[OK, PASS]'
  - key: measure_five
    name: measure_five
  - key: measure_six
    name: measure_six
    unit: degree
    validators:
    - operator: '>'
      expected_value: 3.0
  - key: double_validators
    name: double_validators
    validators:
    - operator: '>'
      expected_value: 25.0
    - operator: <
      expected_value: 40.0
  - key: empty
    name: empty
    validators:
    - operator: '>'
      expected_value: 1.0
  - key: no_measurement_in_python
    name: no_measurement_in_python
    unit: Degree
    validators:
    - operator: '>'
      expected_value: 24.0
- key: phase_5
  name: Check phase without measurement
  python: phases.print_information_in_phase:phase_only
  depends_on:
  - phase_1
  - phase_2
  - phase_3

teardown:
- key: phase_4
  name: ciao berte
  python: phases.print_information_in_phase:perform_electrical_tests
  measurements:
  - key: power_off
    name: power_off
    unit: --
    validators:
    - operator: matches
      expected_value: off
