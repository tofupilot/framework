name: Text Input
version: 1.0.0
description: Comprehensive demonstration of all text input features and parameters
execution:
  model: phase_first
  workers: 1
  on_first_failure: continue
main:
  # ========================================
  # DISPLAY FIELDS (Progressive demonstration)
  # ========================================

  - name: Display
    description: Progressive demonstration of display field options
    ui:
      components:
        # 1. No Label - minimal configuration
        - key: no_label
          type: text_input
          placeholder: "Scan barcode"

        # 2. With Label
        - key: with_label
          type: text_input
          label: "Operator ID"

        # 3. With Description
        - key: with_description
          type: text_input
          label: "Batch Number"
          description: "Found on the component packaging label"

        # 4. With Default Value
        - key: with_default
          type: text_input
          label: "Work Station"
          default_value: "STATION-A"
          description: "Pre-filled with default station assignment"

  # ========================================
  # INPUT VALIDATION
  # ========================================

  - name: Validation
    description: Demonstrates input validation rules at the UI component level
    ui:
      components:
        # Required Field
        - key: required_field
          type: text_input
          label: "Device Serial Number"
          placeholder: "Scan or enter serial"
          description: "Required field must be filled before continuing"

        # Pattern - Serial Number
        - key: pattern_serial
          type: text_input
          label: "MAC Address"
          placeholder: "AA:BB:CC:DD:EE:FF"
          description: "Format: XX:XX:XX:XX:XX:XX (hexadecimal pairs)"
          pattern: "^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$"

  # ========================================
  # PREFIX & SUFFIX
  # ========================================

  - name: Modifiers
    description: Prefix and suffix are automatically added to the submitted value
    ui:
      components:
        # Prefix - Part Number
        - key: prefix_part
          type: text_input
          label: "Component Part Number"
          placeholder: "Enter part ID"
          description: "Prefix automatically adds PCB- to submitted value"
          prefix: "PCB-"

        # Suffix - Revision
        - key: suffix_revision
          type: text_input
          label: "Firmware Version"
          placeholder: "2.4.1"
          description: "Suffix automatically adds -prod to submitted value"
          suffix: "-prod"

        # Both Prefix and Suffix
        - key: both_prefix_suffix
          type: text_input
          label: "Test Reference"
          placeholder: "reference-id"
          description: "Submitted as TEST-{value}-REV"
          prefix: "TEST-"
          suffix: "-REV"

  # ========================================
  # DATA BINDING (With Python Runtime)
  # ========================================

  - name: Value
    description: Binds input value to unit.serial_number
    python: phases/bind_to_unit
    ui:
      components:
        - key: unit_serial
          type: text_input
          label: "Unit Serial Number"
          placeholder: "Enter unit serial number"
          description: "This value will be automatically saved to unit.serial_number metadata"
          bind: unit.serial_number
