name: Artificial Horizon
version: 1.0.0
description: Real-time attitude indicator with streaming data from Python
execution:
  model: phase_first
  workers: 1
  on_first_failure: continue
main:
  - name: Flight Simulation
    description: Real-time attitude updates from Python simulation
    python: phases/simulate_flight
    ui:
      components:
        - key: attitude_display
          type: artificial_horizon
          label: "Live Flight Attitude"
          default_value: '{"roll": 0, "pitch": 0}'
          description: "Real-time attitude indicator updated from Python"
