name: Slider
version: 1.0.0
description: Comprehensive demonstration of all slider features and parameters
execution:
  model: phase_first
  workers: 1
  on_first_failure: continue
main:
  # ========================================
  # DISPLAY FIELDS
  # ========================================

  - name: Display
    description: Progressive demonstration of display field options
    ui:
      components:
        # 1. No Label - minimal configuration
        - key: no_label
          type: slider
          min: 0
          max: 100

        # 2. With Label
        - key: with_label
          type: slider
          label: "Volume"
          min: 0
          max: 100

        # 3. With Description
        - key: with_description
          type: slider
          label: "Brightness"
          min: 0
          max: 100
          description: "Adjust screen brightness level"

        # 4. With Default Value
        - key: with_default
          type: slider
          label: "Temperature"
          min: 0
          max: 100
          default_value: 25
          description: "Slider pre-set to 25"

  # ========================================
  # RANGE CONFIGURATION
  # ========================================

  - name: Range Configuration
    description: Required min/max values and optional step configuration
    ui:
      components:
        # 1. Standard Range (0-100)
        - key: standard_range
          type: slider
          label: "Standard Range"
          min: 0
          max: 100
          description: "Min: 0, Max: 100, Step: 1 (default)"

        # 2. Custom Range
        - key: custom_range
          type: slider
          label: "Custom Range"
          min: -50
          max: 50
          description: "Range from -50 to 50"

        # 3. Small Range
        - key: small_range
          type: slider
          label: "Voltage Setting"
          min: 3.0
          max: 3.6
          step: 0.1
          default_value: 3.3
          description: "Precision range: 3.0V to 3.6V, 0.1V steps"

        # 4. Large Range
        - key: large_range
          type: slider
          label: "Frequency"
          min: 0
          max: 10000
          step: 100
          description: "Wide range: 0 to 10,000 Hz"

        # 5. Fine Granularity
        - key: fine_step
          type: slider
          label: "Opacity"
          min: 0
          max: 1
          step: 0.01
          default_value: 0.5
          description: "Fine control: 0.01 increments"

  # ========================================
  # VALIDATION
  # ========================================

  - name: Validation
    description: Required field validation and unset behavior
    ui:
      components:
        # 1. Optional Slider (starts unset)
        - key: optional_slider
          type: slider
          label: "Optional Setting"
          min: 0
          max: 100
          description: "Starts unset and can be left unset"

        # 2. Required Slider (must be set)
        - key: required_slider
          type: slider
          label: "Critical Parameter"
          min: 0
          max: 100
          description: "Must be adjusted from unset state before continuing"

  # ========================================
  # DATA BINDING (With Python Runtime)
  # ========================================

  - name: Binding
    description: Binds slider value to measurement
    python: phases/bind_to_measurement
    ui:
      components:
        - key: voltage
          type: slider
          label: "Output Voltage"
          min: 0
          max: 5
          step: 0.1
          default_value: 3.3
          description: "This value will be saved as a measurement"
          bind: voltage

  # ========================================
  # PRACTICAL USE CASES
  # ========================================

  - name: Use Cases
    description: Real-world slider configurations
    ui:
      components:
        # 1. Temperature Control
        - key: temperature
          type: slider
          label: "Target Temperature"
          min: 20
          max: 80
          step: 5
          default_value: 25
          description: "Set device temperature in °C"

        # 2. Current Limit
        - key: current_limit
          type: slider
          label: "Current Limit"
          min: 0
          max: 3
          step: 0.1
          default_value: 1.5
          description: "Maximum current in amps"

        # 3. PWM Duty Cycle
        - key: duty_cycle
          type: slider
          label: "PWM Duty Cycle"
          min: 0
          max: 100
          step: 1
          default_value: 50
          description: "Pulse width modulation duty cycle (%)"

        # 4. Delay Time
        - key: delay
          type: slider
          label: "Delay Time"
          min: 0
          max: 1000
          step: 10
          default_value: 100
          description: "Delay in milliseconds"

  # ========================================
  # MULTIPLE SLIDERS
  # ========================================

  - name: Multiple
    description: Form with multiple slider controls
    ui:
      components:
        - key: red
          type: slider
          label: "Red"
          min: 0
          max: 255
          default_value: 128
          description: "Red color channel"

        - key: green
          type: slider
          label: "Green"
          min: 0
          max: 255
          default_value: 128
          description: "Green color channel"

        - key: blue
          type: slider
          label: "Blue"
          min: 0
          max: 255
          default_value: 128
          description: "Blue color channel"
