name: Number Input
version: 1.0.0
description: Comprehensive demonstration of all number input features and parameters
execution:
  model: phase_first
  workers: 1
  on_first_failure: continue
main:
  # ========================================
  # DISPLAY FIELDS
  # ========================================

  - name: Display
    description: Progressive demonstration of display field options
    ui:
      components:
        # 1. No Label - minimal configuration
        - key: no_label
          type: number_input
          placeholder: "Enter value"

        # 2. With Label
        - key: with_label
          type: number_input
          label: "With Label"

        # 3. With Description
        - key: with_description
          type: number_input
          label: "With Description"
          description: "This description provides helpful context below the input field"

        # 4. With Default Value
        - key: with_default
          type: number_input
          label: "With Default Value"
          default_value: 3.3
          description: "Input is pre-filled with a default value"

        # 5. Decimal Precision
        - key: decimal_precision
          type: number_input
          label: "Decimal Precision"
          decimals: 2
          description: "Display with 2 decimal places"

  # ========================================
  # MODIFIERS
  # ========================================

  - name: Modifiers
    description: Numeric increment step configuration
    ui:
      components:
        # 1. Custom Step
        - key: custom_step
          type: number_input
          label: "Custom Step"
          step: 0.5
          description: "Increment/decrement by 0.5 using +/- buttons"

        # 2. Step with Decimals
        - key: step_with_decimals
          type: number_input
          label: "Step with Decimals"
          step: 0.1
          decimals: 1
          description: "Step by 0.1, displayed with 1 decimal place"

        # 3. Integer Step
        - key: integer_step
          type: number_input
          label: "Integer Step"
          step: 10
          description: "Step by 10 for whole numbers"

  # ========================================
  # VALIDATION
  # ========================================

  - name: Validation
    description: Range validation and required field constraints
    ui:
      components:
        # 1. Optional No Constraints
        - key: optional_no_constraints
          type: number_input
          label: "Optional No Constraints"
          description: "Can be left empty, no validation errors"

        # 2. Required Field
        - key: required_field
          type: number_input
          label: "Required Field"
          description: "This field must be filled before submission"

        # 3. Minimum Value
        - key: min_value
          type: number_input
          label: "Minimum Value"
          min: 0
          description: "Cannot enter values below 0"

        # 4. Maximum Value
        - key: max_value
          type: number_input
          label: "Maximum Value"
          max: 100
          description: "Cannot enter values above 100"

        # 5. Range Constraint
        - key: range_constraint
          type: number_input
          label: "Range Constraint"
          min: 3.0
          max: 3.6
          step: 0.1
          decimals: 1
          description: "Value must be between 3.0 and 3.6"

        # 6. All Validation Combined
        - key: all_validation
          type: number_input
          label: "All Validation Combined"
          min: 1
          max: 10
          step: 0.5
          description: "Required field with range 1-10, step 0.5"
