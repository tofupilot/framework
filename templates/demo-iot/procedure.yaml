name: IoT Router Test
version: 1.0.0
description: Electrical and Functional testing

execution:
  strategy: phase_first
  workers: 8
  on_first_failure: stop
  slots:
  - key: slot_a
    name: SLOT_A

unit:
  serial_number:
    default_value: '001122334455'
  part_number:
    default_value: IX01
  revision_number:
    default_value: 3.0.4
  batch_number:
    default_value: 2025-004

setup:
- name: Setup All
  python: phases.setup:all_setup
  description: Initialize shared resources and connect to device

main:
- name: Test AIN1
  python: phases.checklist:test_ain1
  description: Test Analog Input 1 functionality
  measurements:
  - name: mean_voltage
    unit: V
    validators:
    - operator: '>'
      expected_value: 3.2
    - operator: <
      expected_value: 3.4
  - name: std_dev
    validators:
    - operator: <
      expected_value: 0.2
  - name: resolution
    validators:
    - operator: <
      expected_value: 0.5
- name: Check MAC Address
  python: phases.checklist:check_mac_address
  description: Read and validate Ethernet MAC address
  measurements:
  - name: mac_address
    validators:
    - operator: matches
      expected_value: ^([0-9A-Fa-f]{2}:){5}[0-9A-Fa-f]{2}$
  - name: oui
    validators:
    - operator: matches
      expected_value: AC:DE:48
  - name: unicast
    validators:
    - operator: ==
      expected_value: 0.0
- name: Check WiFi MAC
  python: phases.checklist:check_wifi_mac
  description: Read and validate WiFi MAC address
  measurements:
  - name: mac_difference
- name: Check IMEI
  python: phases.checklist:check_imei
  description: Read and validate IMEI number
  measurements:
  - name: imei_number
    validators:
    - operator: matches
      expected_value: ^\d{15}$
- key: phase_1
  name: Manual Electrical Tests
  measurements:
  - name: voltage
    validators:
    - operator: '>'
      expected_value: 3.2
    - operator: <=
      expected_value: 3.5
  - name: current
    validators:
    - operator: <
      expected_value: 1.5
  ui:
    components:
    - type: number_input
      key: number_input
      label: Current?
      required: false
      bind: measurements.current
      trim: true
    - type: slider
      key: slider
      label: Tension?
      required: false
      bind: measurements.voltage
      trim: true
      min: 3.0
      max: 3.6
      step: 0.1
- key: phase_2
  name: Manual Functional Tests
  measurements:
  - name: is_led_switched
    validators:
    - operator: Matches
      expected_value: 'True'
  ui:
    components:
    - type: switch
      key: switch
      label: Is the LED_3 on?
      required: false
      bind: measurements.is_led_switched
      trim: true
      options:
      - value: 'true'
        label: On
      - value: 'false'
        label: Off
  enabled: false
- key: phase_3
  name: Test Power Rail
  python: phases.electrical_tests:test_power_rails
- key: phase_4
  name: Current Consumption
  python: phases.electrical_tests:test_current_consumption
  description: Measure current draw on all rails
  measurements:
  - key: current_3v3_idle
    name: 3.3V Idle Current
    unit: mA
    validators:
    - operator: '>'
      expected_value: 40.0
    - operator: <
      expected_value: 60.0
  - key: current_3v3_active
    name: 3.3V Active Current
    unit: mA
    validators:
    - operator: '>'
      expected_value: 150.0
    - operator: <
      expected_value: 250.0
  - key: current_5v_idle
    name: 5V Idle Current
    unit: mA
    validators:
    - operator: <
      expected_value: 35.0
  - key: current_5v_active
    name: 5V Active Current
    unit: mA
    validators:
    - operator: '>'
      expected_value: 70.0
    - operator: <
      expected_value: 130.0
  - key: current_12v_idle
    name: 12V Idle Current
    unit: mA
    validators:
    - operator: <
      expected_value: 15.0
  - key: current_12v_active
    name: 12V Active Current
    unit: mA
    validators:
    - operator: '>'
      expected_value: 140.0
    - operator: <
      expected_value: 210.0
  - key: power_idle
    name: Total Idle Power
    unit: mW
    validators:
    - operator: <
      expected_value: 500.0
  - key: power_active
    name: Total Active Power
    unit: mW
    validators:
    - operator: <
      expected_value: 3000.0
