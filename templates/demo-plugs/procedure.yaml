name: Plugs Demo
version: 1.0.0
description: Demonstrates hardware plug lifecycle and state management
execution:
  model: slot_first
  workers: 2
  on_first_failure: continue
plugs:
  - key: multimeter
    name: Multimeter
    scope: all
    description: Shared digital multimeter for voltage and current measurements
    python: plugs.python.mock_instruments:MockMultimeter
  - key: power_supply
    name: Power Supply
    description: Programmable power supply for each test slot
    python: plugs.python.mock_instruments:MockPowerSupply
setup:
  - name: setup_all
    scope: all
    python: phases/setup_all
    description: Configure and prepare test equipment - runs once at procedure start
  - name: setup_each
    python: phases/setup_each
    description: Configure and prepare unit under test - runs before each slot
main:
- name: demo_plug_usage
  python: phases/demo_plug_measurement
  description: Demonstrates using hardware plugs for measurements
- name: verify_plug_state
  python: phases/verify_plug_state
  description: Verifies plug state persisted from previous phase
teardown:
  - name: teardown_each
    python: phases/teardown_each
    description: Clean up after testing each individual unit
  - name: teardown_all
    scope: all
    python: phases/teardown_all
    description: Shut down the entire test system once at end

