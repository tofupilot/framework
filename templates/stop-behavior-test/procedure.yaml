name: Stop Behavior Test
version: 2.0.0
description: Test project for stop/kill functionality with various blocking scenarios
execution:
  model: slot_first
  workers: 2
setup:
  - name: setup_all
    scope: all
    python: phases.setup_procedure
    description: Initialize test system
  - name: setup_each
    python: phases.setup_slot
    description: Prepare each unit for testing

main:
  - name: spawn_zombies_test
    python: phases.spawn_zombies_phase
    description: "TEST: Spawns child processes to verify zombie cleanup on exit"
  - name: quick_phase
    python: phases.quick_phase
    description: Fast phase to verify normal operation
  - name: signal_handler
    python: phases.slow_with_signal_handler
    description: Properly handles SIGTERM - should stop gracefully
  - name: blocking_sleep
    python: phases.blocking_sleep_phase
    enabled: false
    description: "PROBLEM: time.sleep() without signal handling - force killed"
  - name: cpu_loop
    python: phases.cpu_loop_phase
    description: "PROBLEM: Tight loop without signal checks - won't respond to SIGTERM"
  - name: blocking_input
    python: phases.blocking_input_phase
    enabled: false
    description: "PROBLEM: input() blocks - won't respond to SIGTERM"
  - name: network_io
    python: phases.network_io_phase
    enabled: false
    description: "PROBLEM: HTTP request blocks - won't respond to SIGTERM during request"
  - name: subprocess_blocking
    python: phases.subprocess_blocking_phase
    enabled: false
    description: "PROBLEM: subprocess.run() blocks parent - won't respond to SIGTERM"

teardown:
  - name: teardown_each
    python: phases.cleanup_slot
    description: Clean up after each unit (should run even when stopped)
  - name: teardown_all
    scope: all
    python: phases.cleanup_procedure
    description: Shutdown test system (should run even when stopped)

