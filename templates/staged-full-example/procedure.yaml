name: Staged Full Example
version: 1.0.0
description: Level 3 - Staged full syntax with setup.all, setup.each, main, teardown.each, teardown.all
execution:
  model: slot_first
  workers: 2
setup:
  - name: initialize_system
    scope: all
    python: phases/initialize_system
    description: Initialize the entire test system once at start

  - name: calibrate_equipment
    scope: all
    python: phases/calibrate_equipment
    description: Calibrate shared test equipment

  - name: prepare_unit
    python: phases/prepare_unit
    description: Prepare each individual unit for testing

  - name: verify_unit_ready
    python: phases/verify_unit_ready
    description: Verify unit is ready for testing

main:
  - name: execute_test_suite
    python: phases/execute_test_suite
    description: Run the main test suite

  - name: collect_measurements
    python: phases/collect_measurements
    description: Collect test measurements

  - name: analyze_data
    python: phases/analyze_data
    description: Analyze collected data

teardown:
  - name: save_unit_data
    python: phases/save_unit_data
    description: Save data for this unit

  - name: reset_unit
    python: phases/reset_unit
    description: Reset the unit after testing

  - name: generate_report
    scope: all
    python: phases/generate_report
    description: Generate final test report

  - name: shutdown_system
    scope: all
    python: phases/shutdown_system
    description: Shut down the entire test system

