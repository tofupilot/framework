name: Executable Phases Demo
version: 1.0.0
description: Demonstrates all executable phase features (command, shell, working_directory)
execution:
  model: slot_first
  workers: 2
  on_first_failure: continue
main:
  - name: Default shell (sh/powershell)
    description: "No shell specified → defaults to sh (Unix) or powershell (Windows)"
    executable:
      command: "echo 'Default shell test'"

  - name: Explicit bash
    description: "shell: bash → uses bash interpreter"
    executable:
      command: "echo 'Running with bash'"
      shell: bash

  - name: Check working directory
    description: "Verify default working directory is procedure directory"
    executable:
      command: "pwd"
      shell: bash

  - name: Absolute working directory
    description: "working_directory: /tmp → absolute path"
    executable:
      command: "pwd"
      shell: bash
      working_directory: "/tmp"

  - name: Relative working directory
    description: "working_directory: phases → relative to procedure dir"
    executable:
      command: "pwd"
      shell: bash
      working_directory: "phases"

  - name: List files in procedure dir
    description: "List files in current directory (procedure dir by default)"
    executable:
      command: "ls -la"
      shell: bash

  - name: Create test file
    description: "Create a file in phases subdirectory"
    executable:
      command: "echo 'test content' > test.txt"
      shell: bash
      working_directory: "phases"

  - name: Read test file
    description: "Read the file we just created"
    executable:
      command: "cat test.txt"
      shell: bash
      working_directory: "phases"

  - name: Exit code 0 (pass)
    description: "Command with exit code 0 → phase passes"
    executable:
      command: "exit 0"
      shell: bash

  - name: Exit code non-zero (fail)
    description: "Command with exit code 1 → phase fails"
    executable:
      command: "exit 1"
      shell: bash
    then:
      fail: continue

  - name: Cleanup test file
    description: "Remove test file created earlier"
    executable:
      command: "rm -f test.txt"
      shell: bash
      working_directory: "phases"

  - name: Non-existent shell (should crash)
    description: "shell: cmd → fails on Unix (Windows-only shell)"
    executable:
      command: "echo 'This will not run on macOS'"
      shell: cmd
    then:
      fail: continue
