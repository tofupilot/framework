name: Dependencies Demo
version: 1.0.0
description: Demonstrates phase dependencies and execution order
execution:
  model: slot_first
  workers: 2
  on_first_failure: continue
main:
  - name: Power On
    description: "Independent phase - runs first"
    executable:
      command: "echo 'Power On: Device powered on' && sleep 2"
      shell: bash

  - name: Test WiFi
    description: "Depends on Power On - waits for power before testing"
    executable:
      command: "echo 'Test WiFi: WiFi connected' && sleep 3"
      shell: bash
    depends_on: [power_on]

  - name: Test Bluetooth
    description: "Depends on Power On - runs in parallel with Test WiFi"
    executable:
      command: "echo 'Test Bluetooth: Bluetooth paired' && sleep 3"
      shell: bash
    depends_on: [power_on]

  - name: Final Check
    description: "Depends on both WiFi and Bluetooth - runs after both complete"
    executable:
      command: "echo 'Final Check: All tests passed' && sleep 2"
      shell: bash
    depends_on: [test_wifi, test_bluetooth]

  - name: Multiple Dependencies Example
    description: "Phase with 3 dependencies"
    executable:
      command: "echo 'Multiple Dependencies: Checking integration' && sleep 1"
      shell: bash
    depends_on:
      - power_on
      - test_wifi
      - test_bluetooth

  - name: Chain Dependency
    description: "Depends on Final Check - creates a chain"
    executable:
      command: "echo 'Chain Dependency: Final validation' && sleep 1"
      shell: bash
    depends_on: [final_check]
