name: Python Module Syntax Demo
version: 1.0.0
description: Demonstrates optional function field and automatic phases/ resolution
execution:
  model: slot_first
  workers: 2
  on_first_failure: continue
main:
  - name: Load full path
    description: "phases/simple.py"
    python: phases.simple

  - name: Load shorthand
    description: "module: simple → resolves to phases/simple.py"
    python: phases/simple

  - name: Load nested full path
    description: "module: phases.python.nested → phases/python/nested.py"
    python: phases.python.nested

  - name: Load nested shorthand
    description: "module: python.nested → resolves to phases/python/nested.py"
    python: python.nested

  - name: Load explicit function
    description: "module: python.nested, function: custom_function"
    python: python.nested:custom_function

  - name: Load relative single dot
    description: "module: .relative → ./relative.py (current dir)"
    python: .relative

  - name: Load relative parent
    description: "module: ..shared.utils → ../shared/utils.py (one level up)"
    python:
      module: ..shared.utils
