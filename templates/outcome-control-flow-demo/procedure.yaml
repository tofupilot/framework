name: Outcome & Control Flow Demo
version: 1.0.0
description: Comprehensive demonstration of all outcome types, phase results, and control flow behaviors

execution:
  strategy: phase_first
  workers: 1
  on_first_failure: stop
  slots:
  - key: slot_a
    name: SLOT_A

unit:
  serial_number:
    default_value: '00000'
    placeholder: '0000'
  part_number:
    default_value: '0000'

main:
- key: case_1_retry
  name: 'Case 1: phase.retry()'
  python: phases/case_1_retry
  description: phase.retry() → RETRY outcome → retries up to limit then fails
  retry:
    limit: 2
    delay: 500ms
- name: 'Case 2: Implicit Continue'
  python: phases/case_2_implicit_continue
  description: return (no explicit result) → CONTINUE → pass outcome
- key: case_3_fail_with_continue
  name: 'Case 3: phase.fail() with continue'
  python: phases/case_3_fail
  description: 'phase.fail() → FAIL outcome → continues (on_first_failure: continue)'
  then:
    fail: continue
- key: phase_1
  name: Should run after case 3
  depends_on:
  - case_3_fail_with_continue
- key: case_4_timeout_override
  name: 'Case 4: Timeout with override'
  python: phases/case_4_timeout
  description: Timeout → TIMEOUT outcome → skip via then.timeout (default would be stop)
  enabled: false
  timeout: 1s
  then:
    timeout: skip
- key: case_5_error
  name: 'Case 5: Exception → Error'
  python: phases/case_5_error
  description: Exception → ERROR outcome → always stops (unless overridden)
  enabled: false
  then:
    error: skip
- key: case_6_stop
  name: 'Case 6: phase.stop()'
  python: phases/case_6_stop
  description: phase.stop() → STOP outcome → always stops execution (unless overridden)
  enabled: false
  then: {}
- key: case_7_skip
  name: 'Case 7: phase.skip()'
  python: phases/case_7_skip
  description: phase.skip() → SKIP outcome → continues to next phase
- key: case_8_measurement_fail
  name: 'Case 8: Measurement Validation Failure'
  python: phases/case_8_measurement_fail
  description: 'Measurement fails validation → FAIL outcome → continues (on_first_failure: continue)'
  measurements:
  - name: voltage
    unit: V
    validators:
    - operator: '>='
      expected_value: 3.0
  enabled: false
- key: case_9_fail_with_stop
  name: 'Case 9: phase.fail() with then.fail: stop'
  python: phases/case_9_fail_with_stop
  description: phase.fail() → FAIL outcome → stops via then.fail override
  enabled: false
  then:
    fail: stop
- name: Never Executed
  python: phases/never_executed
  description: This phase should never execute due to previous stop
